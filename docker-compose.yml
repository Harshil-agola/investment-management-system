services:
  mongodb:
    image: mongo
    container_name: nexachain-mongodb
    restart: unless-stopped
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_DATABASE: investment_db
    volumes:
      - mongodb_data:/data/db
    networks:
      - nexachain-network

